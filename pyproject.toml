[project]
name = "solidedge-mcp"
version = "0.1.0rc1"
description = "Solid Edge MCP server for AI-assisted CAD design — create, analyze, modify, and export"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Tyler Wagler" }]
keywords = ["solid-edge", "cad", "mcp", "model-context-protocol", "com-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "fastmcp>=2.14,<3",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/tylerwagler/SolidEdge-MCP"
Issues = "https://github.com/tylerwagler/SolidEdge-MCP/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
solidedge-mcp = "solidedge_mcp.server:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TC"]
ignore = ["TC001", "TC002", "TC003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/manual holds hand-run COM scripts that touch Solid Edge at import time.
norecursedirs = ["manual", ".*", "__pycache__"]
# Integration tests need a running Solid Edge; opt in with `-m integration`.
addopts = "--strict-markers -m 'not integration'"
markers = [
    "integration: requires a licensed, running Solid Edge on Windows",
]

[tool.coverage.run]
source = ["solidedge_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

# pywin32 / pythoncom have no type stubs
[[tool.mypy.overrides]]
module = [
    "win32com",
    "win32com.*",
    "pythoncom",
    "pywintypes",
]
ignore_missing_imports = true

# Backend mixin modules use cooperative multiple inheritance.
# Mixins access attributes (doc_manager, sketch_manager, etc.) defined on
# the base class; mypy can't resolve these without Protocol refactoring.
[[tool.mypy.overrides]]
module = [
    "solidedge_mcp.backends.features.*",
    "solidedge_mcp.backends.export.*",
    "solidedge_mcp.backends.assembly.*",
    "solidedge_mcp.backends.query.*",
]
disable_error_code = ["attr-defined", "no-any-return"]

# FastMCP decorators (@mcp.tool(), @mcp.resource(), @mcp.prompt()) are untyped
[[tool.mypy.overrides]]
module = [
    "solidedge_mcp.tools.*",
    "solidedge_mcp.prompts",
]
disable_error_code = ["untyped-decorator"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
