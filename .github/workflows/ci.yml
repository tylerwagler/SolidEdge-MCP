name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    # pywin32 is imported at module level, so the unit suite only imports on Windows.
    # Solid Edge itself is not needed: unit tests mock every COM object.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src/
      - name: Unit tests
        run: uv run pytest -q
